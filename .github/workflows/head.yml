name: Prepared head software
on:
  push:
  pull_request:
jobs:
  head:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-head.txt
      - run: python -m compileall -q nightweaver_head editor/bundlePlayer.py
      - run: python -m unittest discover -s tests -p 'test_head_*.py'
